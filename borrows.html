<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Phiếu Mượn Sách</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Quản lý Phiếu Mượn Sách</h2>
        
        <div class="stats">
            <p>Tổng số phiếu: <span id="totalBorrows">0</span></p>
            <p>Đang mượn: <span id="activeBorrows">0</span></p>
            <p>Đã trả: <span id="returnedBorrows">0</span></p>
        </div>

        <button id="btnOpenModal" class="btn btn-primary">Thêm phiếu mượn</button>

        <table>
            <thead>
                <tr>
                    <th>Mã Phiếu</th>
                    <th>Người Mượn</th>
                    <th>Mã Sách</th>
                    <th>Ngày Mượn</th>
                    <th>Hạn Trả</th>
                    <th>Trạng Thái</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <div id="formModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modalTitle">Thêm phiếu mượn</h3>
            <form id="borrowForm">
                <div class="form-group">
                    <label>Mã phiếu mượn:</label>
                    <input type="text" id="borrowId" placeholder="PM-XXXX">
                    <small class="error" id="errBorrowId"></small>
                </div>
                <div class="form-group">
                    <label>Họ tên người mượn:</label>
                    <input type="text" id="borrowerName">
                    <small class="error" id="errBorrowerName"></small>
                </div>
                <div class="form-group">
                    <label>Mã sách:</label>
                    <input type="text" id="bookId" placeholder="BK10234">
                    <small class="error" id="errBookId"></small>
                </div>
                <div class="form-group">
                    <label>Thể loại sách:</label>
                    <select id="category">
                        <option value="">-- Chọn thể loại --</option>
                        <option value="CNTT">CNTT</option>
                        <option value="Kinh tế">Kinh tế</option>
                        <option value="Ngoại ngữ">Ngoại ngữ</option>
                        <option value="Kỹ năng">Kỹ năng</option>
                    </select>
                    <small class="error" id="errCategory"></small>
                </div>
                <div class="form-group">
                    <label>Ngày mượn:</label>
                    <input type="date" id="borrowDate">
                    <small class="error" id="errBorrowDate"></small>
                </div>
                <div class="form-group">
                    <label>Hạn trả:</label>
                    <input type="date" id="returnDate">
                    <small class="error" id="errReturnDate"></small>
                </div>
                <div class="form-group">
                    <label>Số điện thoại:</label>
                    <input type="text" id="phone">
                    <small class="error" id="errPhone"></small>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email">
                    <small class="error" id="errEmail"></small>
                </div>
                <div class="form-group">
                    <label>Trạng thái mượn:</label>
                    <select id="status">
                        <option value="">-- Chọn trạng thái --</option>
                        <option value="Đang mượn">Đang mượn</option>
                        <option value="Đã trả">Đã trả</option>
                    </select>
                    <small class="error" id="errStatus"></small>
                </div>
                <div class="form-group">
                    <label>Ghi chú:</label>
                    <textarea id="note"></textarea>
                    <small class="error" id="errNote"></small>
                </div>
                <button type="submit" class="btn btn-success">Lưu phiếu mượn</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
